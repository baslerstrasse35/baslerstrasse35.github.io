<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 860" role="img" aria-labelledby="gr-t gr-d" font-family="Figtree, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="gr-t">Grundriss 2.5-Zimmer-Wohnung, Baslerstrasse 35</title>
  <desc id="gr-d">Balkon über die ganze Breite. Darunter links Wohnen, offen zum Essbereich; rechts Zimmer, Bad und Küche. Eingang unten zwischen Essbereich und Küche.</desc>
  <defs>
    <pattern id="parkett" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#EBCB9E"/>
      <path d="M0 3h12M0 6h12M0 9h12M12 15h12M12 18h12M12 21h12M15 0v12M18 0v12M21 0v12M3 12v12M6 12v12M9 12v12" stroke="#D9AF78" stroke-width="0.7"/>
      <path d="M0 12h24M12 0v24M0 0h24M0 0v24" stroke="#C99A5E" stroke-width="0.7"/>
    </pattern>
    <pattern id="platten" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#DDE2E5"/>
      <path d="M20 0v20M0 20h20" stroke="#C3CBD0" stroke-width="0.8"/>
    </pattern>
    <pattern id="fliesen" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F4F2EE"/>
      <path d="M10 0v10M0 10h10" stroke="#DCD7CF" stroke-width="0.6"/>
    </pattern>
    <pattern id="deck" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#D8A36B"/>
      <path d="M0 5h15M0 10h15M15 20h15M15 25h15M20 0v15M25 0v15M5 15v15M10 15v15" stroke="#B9824A" stroke-width="0.8"/>
      <path d="M0 15h30M15 0v30M0 0h30M0 0v30" stroke="#9C6A38" stroke-width="0.9"/>
    </pattern>
  </defs>

  <!-- Balkon -->
  <rect x="40" y="40" width="440" height="100" fill="url(#deck)"/>
  <line x1="30" y1="40" x2="490" y2="40" stroke="#2A3237" stroke-width="3"/>
  <line x1="40" y1="44" x2="480" y2="44" stroke="#2A3237" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="36" y="40" width="8" height="100" fill="#2A3237"/>
  <rect x="251" y="46" width="8" height="22" fill="#2A3237"/>
  <rect x="476" y="40" width="8" height="100" fill="#2A3237"/>

  <!-- Räume -->
  <rect x="40" y="140" width="215" height="650" fill="url(#parkett)"/>
  <rect x="255" y="140" width="225" height="300" fill="url(#parkett)"/>
  <rect x="255" y="440" width="225" height="150" fill="url(#fliesen)"/>
  <rect x="255" y="590" width="225" height="200" fill="url(#platten)"/>

  <!-- Einbauten Küche -->
  <rect x="452" y="596" width="24" height="190" fill="#9AA6AD" stroke="#2A3237" stroke-width="1"/>
  <rect x="455" y="640" width="18" height="28" rx="3" fill="#fff" stroke="#2A3237" stroke-width="0.8"/>
  <circle cx="464" cy="720" r="5" fill="none" stroke="#2A3237" stroke-width="0.8"/>
  <circle cx="464" cy="738" r="5" fill="none" stroke="#2A3237" stroke-width="0.8"/>
  <rect x="262" y="596" width="36" height="36" fill="#9AA6AD" stroke="#2A3237" stroke-width="1"/>
  <path d="M262 596l36 36M298 596l-36 36" stroke="#2A3237" stroke-width="0.8"/>
  <!-- Bad -->
  <rect x="404" y="452" width="42" height="112" rx="10" fill="#fff" stroke="#2A3237" stroke-width="1.2"/>
  <rect x="410" y="460" width="30" height="96" rx="8" fill="none" stroke="#2A3237" stroke-width="0.8"/>
  <ellipse cx="316" cy="570" rx="11" ry="14" fill="#fff" stroke="#2A3237" stroke-width="1.2"/>
  <path d="M346 584h32v-12a16 10 0 0 0 -32 0z" fill="#fff" stroke="#2A3237" stroke-width="1.2"/>
  <line x1="454" y1="446" x2="454" y2="586" stroke="#2A3237" stroke-width="1"/>

  <!-- Aussenwände -->
  <g stroke="#2A3237" stroke-width="8" stroke-linecap="square" fill="none">
    <line x1="40" y1="140" x2="40" y2="790"/>
    <line x1="480" y1="140" x2="480" y2="790"/>
    <line x1="40" y1="790" x2="270" y2="790"/>
    <line x1="330" y1="790" x2="480" y2="790"/>
  </g>
  <!-- Fassade zum Balkon (Fenster/Türen) -->
  <g stroke="#2A3237">
    <line x1="40" y1="140" x2="480" y2="140" stroke-width="3"/>
    <line x1="40" y1="137" x2="480" y2="137" stroke-width="1"/>
  </g>
  <!-- Innenwände -->
  <g stroke="#2A3237" stroke-width="5" stroke-linecap="square" fill="none">
    <line x1="255" y1="140" x2="255" y2="345"/>
    <line x1="255" y1="395" x2="255" y2="465"/>
    <line x1="255" y1="515" x2="255" y2="630"/>
    <line x1="255" y1="440" x2="480" y2="440"/>
    <line x1="255" y1="590" x2="480" y2="590"/>
    <line x1="40" y1="596" x2="172" y2="596"/>
  </g>
  <line x1="255" y1="632" x2="255" y2="786" stroke="#2A3237" stroke-width="1.2" stroke-dasharray="5 5"/>
  <!-- Fenster unten -->
  <g stroke="#fff" stroke-width="4"><line x1="70" y1="790" x2="150" y2="790"/><line x1="170" y1="790" x2="240" y2="790"/><line x1="350" y1="790" x2="445" y2="790"/></g>
  <g stroke="#2A3237" stroke-width="1"><line x1="70" y1="790" x2="150" y2="790"/><line x1="170" y1="790" x2="240" y2="790"/><line x1="350" y1="790" x2="445" y2="790"/></g>

  <!-- Türen -->
  <g fill="none" stroke="#2A3237" stroke-width="1.2">
    <path d="M190 140v44M190 184a44 44 0 0 0 44 -44" stroke-dasharray="0"/>
    <path d="M320 140v44M320 184a44 44 0 0 1 -44 -44"/>
    <path d="M255 345h46M301 345a46 46 0 0 1 -46 46"/>
    <path d="M255 465h46M301 465a46 46 0 0 1 -46 46" transform="translate(0 0)"/>
    <path d="M275 790v-52M275 738a52 52 0 0 1 52 52"/>
  </g>
  <g fill="#2A3237"><rect x="186" y="136" width="4" height="8"/><rect x="316" y="136" width="4" height="8"/></g>

  <!-- Eingang -->
  <path d="M300 842l-9 -14h18z" fill="#2A3237"/>
  <text x="300" y="822" text-anchor="middle" font-size="12" fill="#2A3237" font-weight="600">Eingang</text>

  <!-- Beschriftung -->
  <g font-size="15" font-weight="700" fill="#20272B" text-anchor="middle">
    <g><rect x="200" y="72" width="120" height="40" rx="8" fill="#FBFAF7" opacity=".92"/><text x="260" y="90">Balkon</text><text x="260" y="106" font-size="12" font-weight="500">13.7 m²</text></g>
    <g><rect x="92" y="340" width="110" height="40" rx="8" fill="#FBFAF7" opacity=".92"/><text x="147" y="358">Wohnen</text><text x="147" y="374" font-size="12" font-weight="500">23.1 m²</text></g>
    <g><rect x="312" y="262" width="110" height="40" rx="8" fill="#FBFAF7" opacity=".92"/><text x="367" y="280">Schlafen</text><text x="367" y="296" font-size="12" font-weight="500">14.6 m²</text></g>
    <g><rect x="92" y="672" width="110" height="40" rx="8" fill="#FBFAF7" opacity=".92"/><text x="147" y="690">Essen</text><text x="147" y="706" font-size="12" font-weight="500">16.2 m²</text></g>
    <g><rect x="312" y="668" width="110" height="40" rx="8" fill="#FBFAF7" opacity=".92"/><text x="367" y="686">Küche</text><text x="367" y="702" font-size="12" font-weight="500">7.2 m²</text></g>
    <g><rect x="310" y="492" width="80" height="40" rx="8" fill="#FBFAF7" opacity=".92"/><text x="350" y="510">Bad</text><text x="350" y="526" font-size="12" font-weight="500">5.6 m²</text></g>
  </g>
</svg>
